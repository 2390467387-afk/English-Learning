<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#ff6fa3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="考研单词">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>考研英语 · 单词工作台</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#f4f5f8; --surface:#ffffff; --surface2:#eef0f4; --text:#1a1d26; --muted:#6a7282;
  --border:#e1e4ea; --accent:#3a63f0; --accent-soft:#e6ecff; --accent-ink:#ffffff;
  --danger:#d63b3b; --danger-soft:#fdeaea; --ok:#1c9a62; --shadow:0 1px 2px rgba(20,24,40,.06),0 4px 14px rgba(20,24,40,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1116; --surface:#181b22; --surface2:#21252e; --text:#eceff5; --muted:#98a1b1;
    --border:#2a2f3a; --accent:#7096ff; --accent-soft:#1d2848; --accent-ink:#0a1022;
    --danger:#ff7676; --danger-soft:#3a1f22; --ok:#4cc88d; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1116; --surface:#181b22; --surface2:#21252e; --text:#eceff5; --muted:#98a1b1;
  --border:#2a2f3a; --accent:#7096ff; --accent-soft:#1d2848; --accent-ink:#0a1022;
  --danger:#ff7676; --danger-soft:#3a1f22; --ok:#4cc88d; --shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:96px;
}
#app{max-width:680px;margin:0 auto;padding:14px 14px 0}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 12px}
header.top h1{font-size:19px;margin:0;letter-spacing:.2px}
header.top .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.chip-status{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:4px 10px;border-radius:99px;white-space:nowrap}
h2{font-size:18px;margin:6px 2px 10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.label{font-size:13.5px;font-weight:600;margin:0 0 8px;color:var(--text)}
.label em{font-style:normal;font-weight:400;color:var(--muted);margin-left:6px;font-size:12.5px}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.fld{display:block;margin-bottom:10px}
.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,textarea,select{
  width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface2);
  border:1px solid var(--border);border-radius:12px;padding:10px 12px;outline:none;min-height:44px;
}
input[type="range"]{padding:0;min-height:32px;accent-color:var(--accent)}
input[type="checkbox"]{width:auto;min-height:0}
textarea{resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input:disabled{opacity:.6}
button{
  font:inherit;font-size:15px;min-height:44px;padding:9px 16px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent;
}
button:active{transform:scale(.98)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
button.big{width:100%;min-height:50px;font-size:17px;margin-top:10px}
button.ghost{background:transparent}
button.link{background:none;border:none;color:var(--accent);padding:6px 8px;min-height:36px;font-size:14px}
button.danger{color:var(--danger)}
button.armed{background:var(--danger);color:#fff;border-color:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:0 0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 label{font-size:13px;color:var(--muted)}
.grid2 label input{margin-top:4px;color:var(--text)}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:none;background:transparent;min-height:38px;padding:6px 4px;font-size:14px}
.seg button.on{background:var(--surface);box-shadow:var(--shadow);font-weight:600;color:var(--accent)}
.picker{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;gap:0;padding:8px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);cursor:pointer;min-width:112px}
.chip input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.chip span{font-size:14.5px;font-weight:600}
.chip small{font-size:12px;color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.chip.on span{color:var(--accent)}
.mini{display:flex;gap:4px;margin-top:6px}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}
details.sec{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:8px;font-weight:600}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--muted);transition:transform .15s;font-size:13px}
details.sec[open]>summary::before{transform:rotate(90deg)}
.pill{font-size:11.5px;font-weight:500;color:var(--muted);background:var(--surface2);padding:2px 8px;border-radius:99px}
.sec-body{padding:0 14px 12px}
.ent{padding:10px 0;border-top:1px solid var(--border)}
.ent .w{font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px}
.ent .m{color:var(--text);margin-top:1px}
.ent ul{margin:6px 0 0;padding:0;list-style:none}
.ent li{font-size:14px;color:var(--muted);padding:2px 0 2px 10px;border-left:2px solid var(--accent-soft)}
.ent li b{color:var(--text);font-weight:600}
.ent .ea{display:flex;gap:2px;margin-top:4px}
.ent .ea button{min-height:34px;padding:4px 10px;font-size:13px}
.snd{min-height:32px;padding:2px 8px;font-size:15px;background:none;border:none}
details.batch>summary{cursor:pointer;font-weight:600;font-size:14.5px;list-style:none}
details.batch>summary::-webkit-details-marker{display:none}
details.batch[open]>summary{margin-bottom:10px}
code{background:var(--surface2);padding:1px 6px;border-radius:6px;font-size:12.5px}
/* player */
.player{display:flex;flex-direction:column;gap:12px}
.topline{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.stage{text-align:center;padding:26px 10px;min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.stage .task{font-size:20px;font-weight:700}
.stage .dots{display:flex;gap:8px;justify-content:center}
.stage .dots i{width:11px;height:11px;border-radius:50%;background:var(--surface2);border:1px solid var(--border)}
.stage .dots i.on{background:var(--accent);border-color:var(--accent)}
.stage .status{color:var(--muted);font-size:14.5px;min-height:22px}
.stage .word{font-size:34px;font-weight:800;letter-spacing:.3px;word-break:break-word}
.stage .mean{font-size:18px;color:var(--text);opacity:.9}
.stage.hide .word,.stage.hide .mean{filter:blur(9px);user-select:none}
.ctrl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ctrl button{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 2px;font-size:12.5px;line-height:1.25}
.ctrl button b{font-size:19px;font-weight:400}
.hidden{display:none!important}
.ans{border-top:1px solid var(--border);padding:12px 0}
.ans:first-child{border-top:none;padding-top:2px}
.ans .hd{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.ans .no{background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:8px;padding:1px 8px}
.ans .a{font-size:18px;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:4px;word-break:break-word}
.ans .a small{font-weight:400;font-size:14.5px;color:var(--muted)}
.ans .h{font-size:13.5px;color:var(--muted);margin-top:1px}
.warn{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
nav#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--border);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
}
nav#tabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:50px;padding:4px 0;font-size:11.5px;color:var(--muted);border-radius:10px}
nav#tabs button b{font-size:20px;font-weight:400;line-height:1.2;filter:grayscale(.6)}
nav#tabs button.on{color:var(--accent);font-weight:600}
nav#tabs button.on b{filter:none}
#errbar{margin:0 0 10px}
.ok{color:var(--ok)}
.lgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 10px}
.lgrid button.lt{min-height:42px;padding:0;font-size:16px;font-weight:700}
.lgrid button.lt.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.lgrid button.lt.mod{border-color:var(--accent)}
.lcur{margin:4px 0 10px;font-size:15px}
.hdrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.hdrow .label{margin:0}
.hdrow input[type="date"]{width:auto;min-height:38px;padding:4px 10px;font-size:15px}

:root{--bg:#fff3f7;--surface:#fff;--surface2:#ffe8f0;--text:#4a2c3a;--muted:#a37b8e;--border:#ffd3e3;--accent:#ff6fa3;--accent-soft:#ffe0ec;--accent-ink:#fff;--danger:#e0475b;--danger-soft:#ffe3e7;--ok:#2fa57a;--shadow:0 2px 12px rgba(255,111,163,.16)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#22141b;--surface:#2d1b25;--surface2:#3a2330;--text:#ffe8f1;--muted:#d1a3b8;--border:#4a2c3c;--accent:#ff8fb8;--accent-soft:#4a2437;--accent-ink:#2a0f1c;--danger:#ff8a98;--danger-soft:#4a2229;--ok:#6fd7a8;--shadow:none}}
body{padding-bottom:36px;background:linear-gradient(180deg,var(--bg),var(--surface2) 140%) fixed}
header.top,nav#tabs{display:none}
.bar2{display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:18px;font-weight:700}
.bar2 button{min-height:40px;padding:0 12px;font-size:22px;line-height:1;border-radius:99px}
.hhead{display:flex;align-items:center;gap:12px;margin:6px 2px 14px}
.hhead h1{margin:0;font-size:22px}.hhead .sub{font-size:13px;color:var(--muted)}.hhead .gear{margin-left:auto;font-size:20px;padding:0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:18px;padding:14px 4px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:30px;color:var(--accent);line-height:1.2}.stat span{font-size:13px;color:var(--muted)}
.qc{background:linear-gradient(135deg,var(--accent-soft),var(--surface));border-color:var(--accent)}
.qc .big2{font-size:17px;font-weight:700}.qbar{height:8px;border-radius:9px;background:var(--surface2);margin-top:8px;overflow:hidden}.qbar i{display:block;height:100%;background:var(--accent)}
.feat{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.feat .ic{flex:0 0 52px;height:52px;border-radius:16px;background:var(--accent-soft);display:grid;place-items:center;font-size:26px}
.feat:first-of-type .ic{background:var(--accent)}
.feat b{display:block;font-size:17px}.feat small{color:var(--muted);font-size:13px}.feat .ar{margin-left:auto;color:var(--muted);font-size:20px}
.rec1{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.qword{font-size:34px;font-weight:800;text-align:center;margin:10px 0 2px;word-break:break-word}.qhint{text-align:center;font-size:18px;margin:8px 0}.blanks{text-align:center;letter-spacing:2px;color:var(--muted);margin-bottom:8px}
.opts{display:grid;gap:10px;margin-top:12px}.opt{text-align:left;min-height:52px;background:var(--surface);border:2px solid var(--border);border-radius:16px;font-size:16px}
.opt.good{background:#dff7ea;border-color:var(--ok);color:#14603f}.opt.bad{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.fbk{margin-top:12px;padding:12px;border-radius:14px;background:var(--surface2);text-align:center}
.modal{position:fixed;inset:0;z-index:50;background:rgba(60,20,40,.45);display:grid;place-items:center;padding:20px}
.modal>div{background:var(--surface);border-radius:26px;padding:22px 20px;max-width:340px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal .en{font-size:18px;font-weight:700;margin:10px 0 2px;user-select:text}.modal .zh{color:var(--muted);margin-bottom:14px}

body{background:radial-gradient(circle,rgba(255,111,163,.22) 1.6px,transparent 1.9px) 0 0/26px 26px,linear-gradient(180deg,var(--bg),var(--surface2) 140%) fixed}
.mi{display:inline-block;vertical-align:middle;object-fit:contain}
.mi.rd{border-radius:26%;object-fit:cover}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
.bob{animation:bob 2.6s ease-in-out infinite}
.feat .ic,.feat:first-of-type .ic{flex:0 0 58px;height:58px;background:var(--accent-soft);border-radius:18px}
.qc{position:relative;padding-right:92px}.qm{position:absolute;right:12px;top:10px}
.parade{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:18px 0 4px}
.stage>div:first-child{margin:0 auto}
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));
  background:#222a;background:rgba(30,32,40,.94);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:40;
  max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;
}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="bar" class="bar2 hidden"><button data-act="home" aria-label="返回">‹</button><span id="barT"></span></div>
  <header class="top">
    <div>
      <h1>📖 考研英语 · 单词工作台</h1>
      <div class="sub" id="hdrStat"></div>
    </div>
    <div class="chip-status" id="saveStat">…</div>
  </header>
  <div id="errbar" class="warn hidden"></div>
  <main id="view"></main>
</div>
<nav id="tabs">
  <button data-tab="rec"><b>✏️</b>记录</button>
  <button data-tab="dict"><b>📝</b>听写</button>
  <button data-tab="read"><b>🔊</b>读单词</button>
  <button data-tab="ear"><b>🎧</b>磨耳朵</button>
  <button data-tab="set"><b>⚙️</b>设置</button>
</nav>
<div id="toast"></div>
<div id="modal" class="modal hidden"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function fmtDate(d){
  const [y,m,dd]=d.split('-').map(Number);const dt=new Date(y,m-1,dd);
  const wk='日一二三四五六'[dt.getDay()];const cy=new Date().getFullYear();
  return (y!==cy?y+'年':'')+m+'月'+dd+'日 周'+wk;
}
let toastTimer=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400);}

function showErr(msg){
  const b=document.querySelector('#errbar');if(!b)return;
  b.textContent='页面出了点问题：'+msg+'（可以把这句话发给我）';b.classList.remove('hidden');
}
window.addEventListener('error',e=>{if(e&&e.message&&!/ResizeObserver/i.test(e.message))showErr(e.message);});
window.addEventListener('unhandledrejection',e=>{const m=e&&e.reason&&(e.reason.message||String(e.reason));if(m)showErr(m);});

/* ---------- local storage (guarded) ---------- */
const LS_DATA='kyvocab.data.v1',LS_SET='kyvocab.settings.v1',LS_TOMB='kyvocab.tomb.v1';
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}

/* ---------- state ---------- */
const DEF={gtoken:'',gid:'',keep:false,mi:0,qTarget:0,qEnd:'',qStart:'',enVoice:'',zhVoice:'',rate:0.85,repeat:3,gapRepeat:1.5,gapWord:2,writeGap:8,lmap:{},lcustom:{}};
const S=Object.assign({},DEF,lsGet(LS_SET)||{});
if(!S.lmap||typeof S.lmap!=='object')S.lmap={};
if(!S.lcustom||typeof S.lcustom!=='object')S.lcustom={};
let letterSel='';
const saveSettings=()=>lsSet(LS_SET,S);
let state={sections:{},tomb:{}};
{const cached=lsGet(LS_DATA);if(cached&&typeof cached==='object')state.sections=cleanSections(cached);}
{const tb=lsGet(LS_TOMB);if(tb&&typeof tb==='object')state.tomb=tb;}
const cacheLocal=()=>{lsSet(LS_DATA,state.sections);lsSet(LS_TOMB,state.tomb);};

const cfg={
  dict:{sel:new Set(),what:'both',n:10},
  read:{sel:new Set(),loop:false,show:true},
  ear:{sel:new Set(),shuffle:true,loop:true,show:true},
  quiz:{sel:new Set(),mode:'mix'}
};
const form={date:todayStr(),word:'',meaning:'',phrases:'',batch:''};
let editing=null;
const openSecs=new Set();
let tab='home';
const stage={dict:'setup',read:'setup',ear:'setup',quiz:'setup'};
let dictItems=[];

/* 把存储/云端取回的数据复制成全新的、可修改的普通对象（云端返回的对象是只读的） */
function cleanEntries(list){
  if(!Array.isArray(list))return [];
  return list.filter(e=>e&&e.word).map(e=>({
    id:String(e.id||uid()),addedAt:e.addedAt?Number(e.addedAt):undefined,updatedAt:e.updatedAt?Number(e.updatedAt):undefined,
    word:String(e.word),
    meaning:String(e.meaning||''),
    phrases:Array.isArray(e.phrases)?e.phrases.filter(p=>p&&p.en).map(p=>({en:String(p.en),zh:String(p.zh||'')})):[]
  }));
}
function cleanSections(obj){
  const out={};
  if(obj&&typeof obj==='object')Object.keys(obj).forEach(d=>{
    const s=obj[d];
    if(s&&/^\d{4}-\d{2}-\d{2}$/.test(d))out[d]={date:d,entries:cleanEntries(s.entries)};
  });
  return out;
}

/* ---------- cloud sync (private per-person db, optional) ---------- */
const cloud={col:null,uid:null,why:'正在连接云端…'};
const wq={};
let pendingWrites=0;
function queueWrite(date){
  if(!cloud.col)return;
  const key='sec_'+date;
  pendingWrites++;
  const run=async()=>{
    try{
      const sec=state.sections[date];
      if(sec)await cloud.col.doc(key).set({date:date,entries:sec.entries,updatedAt:Date.now()});
      else await cloud.col.doc(key).delete();
    }catch(e){console.warn(e);toast('云端保存失败，已先存在本机');}
    finally{pendingWrites=Math.max(0,pendingWrites-1);}
  };
  wq[key]=(wq[key]||Promise.resolve()).then(run);
}
function commit(date){cacheLocal();queueWrite(date);renderHeader();schedSync();}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use){cloud.why='未开启云同步（在「设置」里填 GitHub 令牌可开启；若想用 Claude 账号同步，请在 claude.ai 里打开链接）';renderHeader();return;}

    const id=await user.id();
    if(!id){cloud.why='没有拿到账号信息，可能没登录 Claude';renderHeader();return;}
    cloud.uid=id;cloud.col=db.collection('data/users/'+id);
    let first=true;
    cloud.col.onSnapshot(snap=>{
      const remote={};
      snap.docs.forEach(d=>{
        if(d.id.indexOf('sec_')!==0)return;
        const x=d.data();
        if(x&&x.date)remote[x.date]={date:String(x.date),entries:cleanEntries(x.entries)};
      });
      const empty=Object.keys(remote).length===0;
      if(empty&&snap.metadata&&snap.metadata.fromCache)return;
      if(pendingWrites>0||(snap.metadata&&snap.metadata.hasPendingWrites))return;

        first=false;
        if(empty&&Object.keys(state.sections).length){

    renderHeader();

}

/* ---------- data ops ---------- */
function sectionsSorted(desc){const ds=Object.keys(state.sections).sort();return desc?ds.reverse():ds;}
function countsOf(sec){let p=0;sec.entries.forEach(e=>{p+=(e.phrases||[]).length;});return{w:sec.entries.length,p:p};}
function upsertEntry(date,e){
  const sec=state.sections[date]||(state.sections[date]={date:date,entries:[]});
  const key=e.word.trim().toLowerCase();
  const ex=sec.entries.find(x=>x.word.toLowerCase()===key);
  if(ex){
    if(e.meaning)ex.meaning=e.meaning;
    ex.phrases=ex.phrases||[];
    const have=new Set(ex.phrases.map(p=>p.en.toLowerCase()));
    (e.phrases||[]).forEach(p=>{if(!have.has(p.en.toLowerCase())){ex.phrases.push(p);have.add(p.en.toLowerCase());}});
    ex.updatedAt=Date.now();return 'updated';
  }
  sec.entries.push({id:uid(),addedAt:Date.now(),updatedAt:Date.now(),word:e.word.trim(),meaning:(e.meaning||'').trim(),phrases:e.phrases||[]});
  return 'added';
}
function parsePhrase(s){
  s=String(s||'').trim();if(!s)return null;
  const m=s.match(/^(.*?)\s*(?:=|＝|\||｜|\t)\s*(.+)$/);
  if(m){return m[1].trim()?{en:m[1].trim(),zh:m[2].trim()}:null;}
  const i=s.search(/[\u3400-\u9fff（【]/);
  if(i>0)return{en:s.slice(0,i).trim(),zh:s.slice(i).trim()};
  if(i===0)return null;
  return{en:s,zh:''};
}
const parsePhrases=(text,sep)=>String(text||'').split(sep||/\n/).map(parsePhrase).filter(Boolean);
function parseBatch(text){
  const out=[];
  String(text||'').split(/\n/).forEach(line=>{
    line=line.trim();if(!line)return;
    let word,meaning,phrases=[];
    if(/[|｜]/.test(line)){
      const parts=line.split(/[|｜]/).map(x=>x.trim());
      word=parts[0];meaning=parts[1]||'';
      phrases=parsePhrases(parts.slice(2).join(' | '),/[;；]/);
    }else{
      const i=line.search(/[\u3400-\u9fff]/);
      if(i>0){
        const head=line.slice(0,i).trim(),rest=line.slice(i).trim();
        const pm=head.match(/\s+((?:(?:n|v|adj|adv|prep|conj|pron|vt|vi|num|art|int|aux)\.(?:\s*[&\/,]\s*|\s+)?)+)$/i);
        if(pm){word=head.slice(0,pm.index).trim();meaning=(pm[1].trim()+' '+rest).trim();}
        else{word=head;meaning=rest;}
      }
      else{word=line;meaning='';}
    }
    if(word)out.push({word:word,meaning:meaning,phrases:phrases});
  });
  return out;
}


/* ---------- GitHub Gist 同步（独立版用） ---------- */
const G={busy:false,msg:'',t:null},GF='kaoyan-vocab.json';
const gOn=()=>!!(S.gtoken&&S.gid);
function flat(){const o=[];Object.keys(state.sections).forEach(d=>state.sections[d].entries.forEach(e=>o.push({id:e.id,date:d,word:e.word,meaning:e.meaning||'',phrases:e.phrases||[],addedAt:e.addedAt||0,updatedAt:e.updatedAt||e.addedAt||0})));return o;}
function unflat(l){const m={};l.forEach(e=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(String(e.date||'')))return;(m[e.date]||(m[e.date]={date:e.date,entries:[]})).entries.push({id:String(e.id),addedAt:e.addedAt||undefined,updatedAt:e.updatedAt||undefined,word:String(e.word),meaning:String(e.meaning||''),phrases:(e.phrases||[]).map(p=>({en:String(p.en),zh:String(p.zh||'')}))});});return m;}
const sigOf=(l,t)=>(l||[]).map(e=>e.id+':'+(e.updatedAt||0)).sort().join(',')+'|'+Object.keys(t||{}).sort().map(k=>k+':'+t[k]).join(',');
function mergeFlat(a,b,ta,tb){
  const tomb=Object.assign({},ta||{});Object.keys(tb||{}).forEach(k=>{tomb[k]=Math.max(tomb[k]||0,tb[k]);});
  const map={};a.concat(b||[]).forEach(e=>{if(!e||!e.id||!e.word)return;const c=map[e.id];if(!c||(e.updatedAt||0)>(c.updatedAt||0))map[e.id]=e;});
  const list=Object.keys(map).map(k=>map[k]).filter(e=>!(tomb[e.id]&&tomb[e.id]>=(e.updatedAt||0))).sort((x,y)=>x.id<y.id?-1:1);
  return{list:list,tomb:tomb};
}
async function gistReq(method,body){
  const r=await fetch('https://api.github.com/gists/'+encodeURIComponent(S.gid.trim()),{method:method,cache:'no-store',headers:Object.assign({'Authorization':'Bearer '+S.gtoken.trim(),'Accept':'application/vnd.github+json'},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error('GitHub 返回 '+r.status+(r.status===401?'（令牌不对或已过期）':r.status===404?'（Gist 编号不对，或令牌没勾选 gist 权限）':''));
  return r.json();
}
async function syncNow(manual){
  if(!gOn()){if(manual)toast('先填好令牌和 Gist 编号');return;}
  if(G.busy)return;G.busy=true;G.msg='同步中…';renderHeader();
  try{
    const g=await gistReq('GET'),f=g.files&&g.files[GF];let rem=null;
    if(f){const txt=f.truncated?await (await fetch(f.raw_url,{cache:'no-store'})).text():f.content;try{rem=JSON.parse(txt);}catch(e){rem=null;}}
    const rl=rem&&Array.isArray(rem.entries)?rem.entries:[];
    const mg=mergeFlat(flat(),rl,state.tomb,rem&&rem.tomb);
    state.sections=unflat(mg.list);state.tomb=mg.tomb;cacheLocal();
    if(!f||sigOf(rl,rem&&rem.tomb)!==sigOf(mg.list,mg.tomb)){
      const files={};files[GF]={content:JSON.stringify({v:1,entries:mg.list,tomb:mg.tomb})};
      await gistReq('PATCH',{files:files});
    }
    const d=new Date();G.msg='已同步 '+pad(d.getHours())+':'+pad(d.getMinutes());if(manual)toast('同步成功');
  }catch(e){G.msg='同步失败：'+((e&&e.message)||e);if(manual)toast(G.msg);}
  G.busy=false;renderHeader();refreshViews();
}
function schedSync(){if(!gOn())return;clearTimeout(G.t);G.t=setTimeout(()=>syncNow(false),1500);}
function bootSync(){
  if(gOn())syncNow(false);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&gOn())syncNow(false);});
  setInterval(()=>{if(!document.hidden&&gOn())syncNow(false);},60000);
}

/* ---------- speech ---------- */
const synth=window.speechSynthesis||null;
let voices=[];
function loadVoices(){
  try{voices=synth?synth.getVoices():[];}catch(e){voices=[];}
  if(tab==='set'&&!$('#pIdx'))render();
}
if(synth){loadVoices();if(synth.addEventListener)synth.addEventListener('voiceschanged',loadVoices);else synth.onvoiceschanged=loadVoices;}
const EN_PREF=[/Samantha/i,/Aria/i,/Jenny/i,/Google US English/i,/Ava/i,/Allison/i,/Guy/i,/Natural/i,/Alex/i];
const ZH_PREF=[/Tingting|Ting-Ting/i,/Xiaoxiao/i,/Huihui/i,/Google 普通话|Google.*Chinese/i,/Yunxi/i,/Lili/i];
function voiceList(prefix){
  const l=voices.filter(v=>String(v.lang).toLowerCase().replace('_','-').indexOf(prefix)===0);
  if(prefix==='zh')l.sort((a,b)=>(/zh-cn/i.test(b.lang.replace('_','-'))?1:0)-(/zh-cn/i.test(a.lang.replace('_','-'))?1:0));
  return l;
}
function getVoice(prefix){
  const list=voiceList(prefix);
  const saved=prefix==='en'?S.enVoice:S.zhVoice;
  if(saved){const v=list.find(v=>v.name===saved);if(v)return v;}
  const prefs=prefix==='en'?EN_PREF:ZH_PREF;
  for(let i=0;i<prefs.length;i++){const v=list.find(v=>prefs[i].test(v.name));if(v)return v;}
  if(prefix==='en'){const us=list.find(v=>/en[-_]US/i.test(v.lang));if(us)return us;}
  return list[0]||null;
}
let voiceBad=false;
function speakOnce(text,lang){
  return new Promise(resolve=>{
    let done=false,started=false,tm=null,wd=null;
    const fin=ok=>{if(!done){done=true;clearTimeout(tm);clearTimeout(wd);resolve(ok);}};
    const u=new SpeechSynthesisUtterance(text);
    const v=voiceBad?null:getVoice(lang==='zh'?'zh':'en');
    try{if(v){u.voice=v;u.lang=v.lang;}else u.lang=lang==='zh'?'zh-CN':'en-US';}
    catch(e){u.lang=lang==='zh'?'zh-CN':'en-US';}
    u.rate=lang==='zh'?Math.min(1.3,S.rate+0.15):S.rate;u.pitch=1;u.volume=1;
    u.onstart=()=>{started=true;};u.onend=()=>fin(true);u.onerror=()=>fin(started);
    tm=setTimeout(()=>fin(true),(lang==='zh'?text.length*330:text.length*140)/u.rate+3000);
    wd=setTimeout(()=>{if(!started&&!done){try{synth.cancel();}catch(e){}fin(false);}},3500);
    try{synth.speak(u);}catch(e){fin(true);}
  });
}
async function speakRaw(text,lang){
  if(!synth||!text){await sleep(300);return;}
  if(synth.speaking||synth.pending){synth.cancel();await sleep(90);}
  const ok=await speakOnce(text,lang);
  if(ok===false&&!voiceBad){voiceBad=true;toast('这个声音在你的手机上没响，已换成系统默认声音');await sleep(120);await speakOnce(text,lang);}
}
/* 每个字母的候选读法：第一个是默认；在「设置」的字母试听面板里可以逐个换、也可以自己写 */
const LET_CAND={
  A:['A','ay','eh'],B:['bee','B','be'],C:['see','C','sea'],D:['dee','D','di'],E:['E','ee','eee'],
  F:['eff','F','ef'],G:['jee','G','gee'],H:['aitch','H','aych'],I:['eye','I','ai'],J:['jay','J','jai'],
  K:['kay','K','kei'],L:['el','L','ell'],M:['em','M','emm'],N:['en','N','enn'],O:['oh','O','owe'],
  P:['pee','P','pea'],Q:['cue','Q','queue'],R:['are','R','ar'],S:['ess','S','es'],T:['tee','T','tea'],
  U:['you','U','yoo'],V:['vee','V','vi'],W:['double you','W','double u'],X:['ex','X','eks'],
  Y:['why','Y','wy'],Z:['zee','Z','zed']
};
function letterSay(c){
  c=String(c).toUpperCase();
  if(S.lcustom&&S.lcustom[c])return S.lcustom[c];
  const list=LET_CAND[c];if(!list)return c;
  const idx=(S.lmap&&S.lmap[c])||0;
  return list[idx%list.length];
}
function spellText(w){
  return Array.from(String(w)).map(ch=>/[a-zA-Z]/.test(ch)?letterSay(ch):(ch==='-'?'dash':(ch==="'"||ch==='’')?'apostrophe':ch===' '?'space':'')).filter(Boolean).join(', ');
}
const POS={n:'名词',v:'动词',adj:'形容词',adv:'副词',prep:'介词',conj:'连词',pron:'代词',vt:'及物动词',vi:'不及物动词',num:'数词',art:'冠词',int:'感叹词',aux:'助动词'};
function zhSpeech(t){
  return String(t).replace(/\b(adj|adv|prep|conj|pron|vt|vi|num|art|int|aux|n|v)\.\s*/gi,(m,p)=>(POS[p.toLowerCase()]||'')+'，')
    .replace(/\bsb\.?/gi,'某人').replace(/\bsth\.?/gi,'某物').replace(/[~～]/g,'')
    .replace(/，\s*[\/、]\s*/g,'，').replace(/\//g,'，');
}
function enSpeech(t){
  return String(t).replace(/\bsb\.?/gi,'somebody').replace(/\bsth\.?/gi,'something').replace(/\.{2,}|…/g,' ').replace(/\//g,' or ');
}

/* ---------- player engine ---------- */
const P={mode:null,items:[],idx:0,run:0,state:'idle',rep:0,msg:'',loop:false,shuffle:false};
let wl=null;
async function wake(on){
  try{
    if(on){if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}}
    else if(wl){await wl.release();wl=null;}
  }catch(e){}
}
function halt(){P.run++;try{if(synth&&(synth.speaking||synth.pending))synth.cancel();}catch(e){}}
async function sayc(t,l,my){if(my!==P.run)return false;await speakRaw(t,l);return my===P.run;}
async function wait(ms,my){
  const end=Date.now()+ms;
  while(Date.now()<end){if(my!==P.run)return false;await sleep(Math.min(120,Math.max(10,end-Date.now())));}
  return my===P.run;
}
async function countdown(sec,my,label){
  const end=Date.now()+sec*1000;
  while(true){
    const left=end-Date.now();if(left<=0)break;
    if(my!==P.run)return false;
    P.msg=label+' '+Math.ceil(left/1000)+' 秒';updatePlayUI();
    await sleep(200);
  }
  return my===P.run;
}
function dictSay(it){
  if(it.kind==='word')return{text:enSpeech(it.word),lang:'en'};
  if(it.kind==='en2zh')return{text:enSpeech(it.en),lang:'en'};
  return{text:zhSpeech(it.zh),lang:'zh'};
}
async function playDict(it,my){
  const d=dictSay(it);
  for(let r=1;r<=S.repeat;r++){
    P.rep=r;P.msg='正在朗读 · 第 '+r+' / '+S.repeat+' 遍';updatePlayUI();
    if(!await sayc(d.text,d.lang,my))return false;
    if(r<S.repeat&&!await wait(S.gapRepeat*1000,my))return false;
  }
  return true;
}
async function playRead(it,my){
  for(let r=1;r<=S.repeat;r++){
    P.rep=r;P.msg='正在朗读 · 第 '+r+' / '+S.repeat+' 遍';updatePlayUI();
    if(!await sayc(enSpeech(it.word),'en',my))return false;
    if(r<S.repeat&&!await wait(S.gapRepeat*1000,my))return false;
  }
  return true;
}
async function playEar(it,my){
  for(let r=1;r<=S.repeat;r++){
    P.rep=r;const head='第 '+r+' / '+S.repeat+' 轮 · ';
    P.msg=head+'读单词';updatePlayUI();
    if(!await sayc(enSpeech(it.word),'en',my))return false;
    if(!await wait(450,my))return false;
    P.msg=head+'拼写';updatePlayUI();
    if(!await sayc(spellText(it.word),'en',my))return false;
    if(!await wait(450,my))return false;
    if(it.meaning){
      P.msg=head+'读意思';updatePlayUI();
      if(!await sayc(zhSpeech(it.meaning),'zh',my))return false;
    }
    if(r<S.repeat&&!await wait(S.gapRepeat*1000,my))return false;
  }
  return true;
}
const writeGapFor=it=>S.writeGap<=0?0:(it.kind==='word'?S.writeGap:Math.round(S.writeGap*1.6*10)/10);
async function loop(){
  const my=++P.run;
  P.state='playing';updatePlayUI();
  while(P.idx<P.items.length){
    if(my!==P.run)return;
    updatePlayUI();
    const it=P.items[P.idx];
    const ok=P.mode==='dict'?await playDict(it,my):P.mode==='read'?await playRead(it,my):await playEar(it,my);
    if(!ok||my!==P.run)return;
    const last=P.idx>=P.items.length-1;
    if(P.mode==='dict'){
      if(last){P.state='done';P.msg='全部读完。写完后点下面的按钮查看答案';updatePlayUI();return;}
      const gap=writeGapFor(it);
      if(gap<=0){P.state='waiting';P.msg='写好后点「下一题」';updatePlayUI();return;}
      if(!await countdown(gap,my,'书写时间'))return;
      P.idx++;
    }else{
      P.msg='下一个…';updatePlayUI();
      if(!await wait(S.gapWord*1000,my))return;
      if(last){
        if(P.loop){P.idx=0;if(P.mode==='ear'&&P.shuffle)P.items=shuffle(P.items);continue;}
        P.state='done';P.msg='已全部播放完毕';updatePlayUI();return;
      }
      P.idx++;
    }
  }
}
function startPlayer(mode,items,opts){
  halt();
  if(!synth)toast('当前浏览器不支持朗读，请换 Safari / Chrome / Edge');
  keepAlive(mode!=='dict'&&!!S.keep);

  P.loop=!!(opts&&opts.loop);P.shuffle=!!(opts&&opts.shuffle);
  wake(true);loop();
}
function pPrev(){if(P.idx>0){halt();P.idx--;loop();}}
function pNext(){if(P.idx<P.items.length-1){halt();P.idx++;loop();}}
function pReplay(){halt();loop();}
function pToggle(){
  if(P.state==='playing'){halt();P.state='paused';P.msg='已暂停';updatePlayUI();}
  else if(P.state==='paused'){loop();}
  else if(P.state==='done'){if(P.mode==='dict'){loop();}else{P.idx=0;loop();}}

const localDate=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
function quota(){
  if(!S.qTarget||!S.qStart)return null;
  const t=todayStr();if(t<S.qStart)return null;
  const over=!!(S.qEnd&&t>S.qEnd),end=over?S.qEnd:t;
  const days=Math.round((new Date(end+'T00:00')-new Date(S.qStart+'T00:00'))/864e5)+1;
  let up=0,today=0;
  Object.keys(state.sections).forEach(d=>state.sections[d].entries.forEach(e=>{const u=e.addedAt?localDate(e.addedAt):d;if(u>=S.qStart&&u<=end){up++;if(u===t)today++;}}));
  return{need:S.qTarget*days,up:up,today:today,over:over,days:days,left:Math.max(0,S.qTarget*days-up),debt:Math.max(0,S.qTarget*(days-1)-(up-today))};
}
const quotaLeft=()=>{const q=quota();return q&&!q.over?q.left:0;};
function afterUpload(before){if(before>0&&quotaLeft()===0)celebrate();}

let ka=null;
function silentWav(){const n=8000,h=new Uint8Array(44+n),dv=new DataView(h.buffer),w=(o,t)=>{for(let i=0;i<t.length;i++)h[o+i]=t.charCodeAt(i);};w(0,'RIFF');dv.setUint32(4,36+n,true);w(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);w(36,'data');dv.setUint32(40,n,true);h.fill(128,44);let b='';h.forEach(x=>{b+=String.fromCharCode(x);});return 'data:audio/wav;base64,'+btoa(b);}
function keepAlive(on){
  try{
    if(on){
      if(!ka){ka=new Audio(silentWav());ka.loop=true;}
      const pr=ka.play();if(pr&&pr.catch)pr.catch(()=>{});
      if('mediaSession' in navigator){
        navigator.mediaSession.metadata=new MediaMetadata({title:P.mode==='ear'?'磨耳朵':'读单词',artist:'考研英语工作台'});
        const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f);}catch(e){}};
        h('play',()=>{if(P.state==='paused')pToggle();});h('pause',()=>{if(P.state==='playing')pToggle();});h('nexttrack',pNext);h('previoustrack',pPrev);
      }
    }else if(ka)ka.pause();
  }catch(e){}
}

    if(!it.opts){const pool=shuffle(Array.from(new Set(Q.all.map(x=>x.meaning).filter(m=>m&&m!==it.meaning).concat(DIST))));it.opts=shuffle([it.meaning].concat(pool.slice(0,3)));}
    body='<div class="qword">'+esc(it.word)+'</div><div style="text-align:center"><button class="snd" data-act="q-say">🔊 再听一遍</button></div><div class="opts">'+it.opts.map((o,i)=>'<button class="opt'+(fb?(o===it.meaning?' good':(fb.pick===i?' bad':'')):'')+'" data-act="q-pick" data-i="'+i+'"'+(fb?' disabled':'')+'>'+esc(o)+'</button>').join('')+'<button class="opt" data-act="q-pick" data-i="-1"'+(fb?' disabled':'')+'>不认识</button></div>';
  }else{
    body='<div class="qword">🔊</div><div style="text-align:center"><button class="snd" data-act="q-say">再听一遍</button></div><div class="qhint">'+esc(it.meaning||'')+'</div><div class="blanks">'+'_ '.repeat(Math.min(it.word.length,24))+'</div><input id="qin" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="听写出这个单词"'+(fb?' disabled value="'+esc(fb.typed)+'"':'')+'><div class="row" style="margin-top:10px">'+(fb?'':'<button class="primary" data-act="q-submit">提交</button><button data-act="q-skip">不会</button>')+'</div>';
  }
  v.innerHTML='<div class="topline"><span>已过关 '+Q.done+' / '+Q.total+'</span><button class="link" data-act="q-back">退出</button></div><div class="qbar"><i style="width:'+Math.round(Q.done/Q.total*100)+'%"></i></div><div class="card" style="margin-top:12px"><div style="text-align:center">'+rnd(66)+'</div>'+body+
    (fb?'<div class="fbk">'+rnd(52)+'<br>'+(fb.ok?'✅ 答对啦！':'💔 正确答案：<b>'+esc(it.word)+'</b>　'+esc(it.meaning))+'<div class="row" style="justify-content:center;margin-top:8px"><button class="primary" data-act="q-next">下一个</button></div></div>':'')+'</div>';
  if(!fb){halt();speakRaw(enSpeech(it.word),'en');const i=$('#qin');if(i)i.focus();}
  else if(fb.ok){const id=fb.id;setTimeout(()=>{if(Q&&Q.fb&&Q.fb.id===id)qNext();},900);}
}
function qAnswer(ok,extra){Q.fb=Object.assign({ok:ok,id:uid()},extra||{});quizRender();}
function qNext(){
  const it=Q.queue.shift();
  if(Q.fb.ok){Q.done++;if(!it.miss)Q.first++;}
  else{it.miss++;Q.missed[it.word]=it;delete it.opts;Q.queue.splice(Math.min(3,Q.queue.length),0,it);}
  Q.fb=null;quizRender();
}

function twoTap(btn,key,fn){
  if(armed&&armed.key===key){clearTimeout(armed.t);armed=null;fn();return;}
  if(armed){clearTimeout(armed.t);armed.reset();armed=null;}
  const orig=btn.textContent;btn.textContent='再点一次确认';btn.classList.add('armed');
  const a={key:key,reset:()=>{btn.textContent=orig;btn.classList.remove('armed');}};

function entriesFor(dates){
  const out=[];
  dates.slice().sort().forEach(d=>{const s=state.sections[d];if(s)s.entries.forEach(e=>out.push({word:e.word,meaning:e.meaning,date:d}));});
  return out;
}
function buildPool(dates,inclW,inclP){
  const pool=[];
  dates.forEach(d=>{
    const s=state.sections[d];if(!s)return;
    s.entries.forEach(e=>{
      if(inclW)pool.push({kind:'word',date:d,word:e.word,meaning:e.meaning});
      if(inclP)(e.phrases||[]).forEach(p=>{
        if(p.en&&p.zh)pool.push({kind:Math.random()<0.5?'zh2en':'en2zh',date:d,from:e.word,en:p.en,zh:p.zh});
      });
    });
  });
  return pool;
}

/* ---------- render ---------- */
function renderHeader(){
  let w=0,p=0;
  Object.keys(state.sections).forEach(d=>{const c=countsOf(state.sections[d]);w+=c.w;p+=c.p;});
  $('#hdrStat').textContent=Object.keys(state.sections).length+' 天 · '+w+' 词 · '+p+' 短语';
  $('#saveStat').textContent=cloud.col?'☁️ 已同步':'💾 仅存本机';
  if(tab==='home'&&$('#view')&&$('#view').firstChild)$('#view').innerHTML=homeHTML();
}
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const v=$('#view');
  $('#bar').classList.toggle('hidden',tab==='home');$('#barT').textContent=TITLES[tab]||'';
  if(tab==='home'){v.innerHTML=homeHTML();}
  else if(tab==='quiz'){if(stage.quiz==='setup'){v.innerHTML=quizSetupHTML();updateInfo('quiz');}else quizRender();}
  else if(tab==='rec'){v.innerHTML='<div id="recForm"></div><div id="recList"></div>';renderRecForm();renderRecList();}
  else if(tab==='set'){v.innerHTML=settingsHTML();}
  else{
    const st=stage[tab];
    if(st==='setup'){v.innerHTML=setupHTML(tab);updateInfo(tab);}
    else if(st==='play'){v.innerHTML=playerHTML(tab);updatePlayUI();}
    else{v.innerHTML=answersHTML();}
  }
}
function refreshViews(){
  const ae=document.activeElement;
  const typing=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT');
  if(tab==='home'){render();return;}
  if(tab==='rec'){renderRecList();return;}
  if(typing||P.state==='playing'||P.state==='paused'||P.state==='waiting')return;
  if(tab!=='set'&&stage[tab]==='setup')render();
}
function go(t){
  if(t===tab)return;
  const bg=(P.mode==='read'||P.mode==='ear')&&(P.state==='playing'||P.state==='paused');
  if(P.state!=='idle'&&!bg){halt();wake(false);P.state='idle';}
  ['dict','read','ear','quiz'].forEach(k=>{if(stage[k]==='play'&&!(bg&&k===P.mode))stage[k]='setup';});
  if(synth&&tab==='quiz')halt();
  tab=t;render();window.scrollTo(0,0);
}

/* ---------- starters ---------- */
function dictStart(){
  const dates=[...cfg.dict.sel];
  if(!dates.length){toast('请先选择板块');return;}
  const pool=shuffle(buildPool(dates,cfg.dict.what!=='p',cfg.dict.what!=='w'));
  if(!pool.length){toast('所选板块没有可听写的内容（短语需要同时有英文和意思）');return;}
  let n=Math.max(1,parseInt(cfg.dict.n)||1);
  if(n>pool.length){n=pool.length;toast('数量超过可用内容，已调整为 '+n);}
  dictItems=pool.slice(0,n);
  stage.dict='play';render();startPlayer('dict',dictItems);
}
function listStart(k){
  const dates=[...cfg[k].sel];
  if(!dates.length){toast('请先选择板块');return;}
  let items=entriesFor(dates);
  if(!items.length){toast('所选板块里还没有单词');return;}
  if(k==='ear'&&cfg.ear.shuffle)items=shuffle(items);
  stage[k]='play';render();
  startPlayer(k,items,{loop:cfg[k].loop,shuffle:k==='ear'&&cfg.ear.shuffle});
}
function dictFinish(){halt();wake(false);keepAlive(false);P.state='idle';stage.dict='answers';render();window.scrollTo(0,0);}

/* ---------- backup ---------- */
function exportText(){return JSON.stringify({app:'kaoyan-vocab',v:1,exportedAt:new Date().toISOString(),sections:Object.keys(state.sections).sort().map(d=>state.sections[d])});}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true;}catch(e){}
  try{const ta=$('#bk');ta.value=t;ta.focus();ta.select();return document.execCommand('copy');}catch(e){return false;}
}
function importText(txt){
  let data;
  try{data=JSON.parse(txt);}catch(e){toast('备份内容无法识别');return;}
  const secs=Array.isArray(data)?data:(data&&data.sections);
  if(!Array.isArray(secs)){toast('备份内容无法识别');return;}
  let a=0,u=0;
  secs.forEach(s=>{
    if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(String(s.date||'')))return;
    (s.entries||[]).forEach(e=>{
      if(!e||!e.word)return;
      const ph=(e.phrases||[]).filter(p=>p&&p.en).map(p=>({en:String(p.en),zh:String(p.zh||'')}));
      upsertEntry(s.date,{word:String(e.word),meaning:String(e.meaning||''),phrases:ph})==='added'?a++:u++;
    });
    commit(s.date);
  });
  renderHeader();render();
  toast('导入完成：新增 '+a+'，合并 '+u);
}

/* ---------- events ---------- */
const roots={cfg:cfg,S:S,form:form};
function setPath(path,val){
  const p=path.split('.');let o=roots[p[0]];
  for(let i=1;i<p.length-1;i++)o=o[p[i]];
  o[p[p.length-1]]=val;
}
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.bind)return;
  let val;
  if(t.type==='checkbox')val=t.checked;
  else if(t.type==='number'||t.type==='range'){
    val=Number(t.value);if(isNaN(val))return;
    const mn=t.min!==''?Number(t.min):-Infinity,mx=t.max!==''?Number(t.max):Infinity;
    val=Math.min(mx,Math.max(mn,val));
  }else val=t.value;
  const b=t.dataset.bind;
  setPath(b,val);
  if(b.indexOf('S.')===0)saveSettings();
  if(b==='S.rate'){const o=t.parentElement.querySelector('output');if(o)o.textContent=val;}
  if(b==='form.date')renderRecFormButtonOnly();
  if(b==='cfg.dict.n')updateInfo('dict');
  if(b==='S.qTarget'&&S.qTarget>0&&!S.qStart){S.qStart=todayStr();saveSettings();}
  if((b==='S.gtoken'||b==='S.gid')&&gOn())schedSync();
});
function renderRecFormButtonOnly(){
  const btn=document.querySelector('[data-act="save-entry"]');
  if(btn&&!editing)btn.textContent='添加到「'+fmtDate(form.date||todayStr())+'」';
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.pick){
    const k=t.dataset.pick;
    if(t.checked)cfg[k].sel.add(t.value);else cfg[k].sel.delete(t.value);
    const lab=t.closest('.chip');if(lab)lab.classList.toggle('on',t.checked);
    updateInfo(k);
  }else if(t.dataset&&t.dataset.bind&&t.dataset.bind.indexOf('S.')===0&&t.tagName==='SELECT'){
    /* voice select handled by input event */
  }
});
document.addEventListener('toggle',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('sec')){const d=t.dataset.d;if(t.open)openSecs.add(d);else openSecs.delete(d);}
},true);
document.addEventListener('click',async e=>{
  const tb=e.target.closest('#tabs button');
  if(tb){go(tb.dataset.tab);return;}
  const el=e.target.closest('[data-act]');if(!el)return;

      upsertEntry(d0,{word:'abandon',meaning:'vt. 放弃；遗弃',phrases:parsePhrases('abandon oneself to = 沉溺于\nwith abandon = 放纵地')});
      upsertEntry(d0,{word:'ambiguous',meaning:'adj. 模棱两可的',phrases:parsePhrases('be ambiguous about = 对…态度含糊')});
      upsertEntry(d0,{word:'accumulate',meaning:'v. 积累；堆积',phrases:parsePhrases('accumulate experience = 积累经验')});
      openSecs.add(d0);commit(d0);renderRecList();toast('已加载示例词');break;}
    case 'say':{const en=findEntry(d,i);if(en){halt();speakRaw(enSpeech(en.word),'en');}break;}

      if(editing&&editing.id===i){editing=null;renderRecForm();}
      commit(d);renderRecList();});break;

    case 'read-start':listStart('read');break;

    case 'p-show':{cfg[tab].show=!cfg[tab].show;const st=$('#pStage');if(st)st.classList.toggle('hide',!cfg[tab].show);el.textContent=cfg[tab].show?'🙈 隐藏文字（纯听）':'👁 显示文字';break;}

    case 'import':{const ta=$('#bk');const txt=ta?ta.value.trim():'';if(!txt){toast('请先粘贴备份内容');break;}importText(txt);break;}
    case 'clear-all':twoTap(el,'clear',()=>{
      const ds=Object.keys(state.sections);ds.forEach(k=>state.sections[k].entries.forEach(x=>{state.tomb[x.id]=Date.now();}));state.sections={};ds.forEach(x=>queueWrite(x));
      cfg.dict.sel.clear();cfg.read.sel.clear();cfg.ear.sel.clear();cacheLocal();renderHeader();render();toast('已清空');});break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='qin'){e.preventDefault();const b=document.querySelector('[data-act="q-submit"]');if(b)b.click();return;}
  if(e.key==='Enter'&&e.target&&e.target.id==='f-word'){e.preventDefault();const m=$('#f-meaning');if(m)m.focus();}
  else if(e.key==='Enter'&&e.target&&e.target.id==='f-meaning'){e.preventDefault();const m=$('#f-phr');if(m)m.focus();}
});

/* ---------- boot ---------- */
renderHeader();render();initCloud();bootSync();
})();
</script>
<script>if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
